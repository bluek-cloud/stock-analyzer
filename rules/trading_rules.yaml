# ==========================================
# StockMap 기술적 분석 전문 지식 및 전략 룰셋
# ==========================================

# 1. 시장 국면(Regime)별 설명 및 지표 해석 템플릿
regimes:
  "에너지 응축 (스퀴즈)":
    description: "볼린저 밴드가 극도로 수축하며 에너지를 모으는 변곡점 구간입니다."
    rsi_comment: "볼린저 밴드 수축 국면이므로 RSI의 움직임이 매우 둔화되어 있습니다. 방향성 탐색 중입니다."
    macd_comment: "이동평균선이 밀집하며 MACD도 0선에 완전히 수렴했습니다. 폭풍 전야의 고요한 상태입니다."
    integrated_analysis: "• 변동성이 극도로 응축된 상태입니다. 곧 강한 방향성 분출이 예상됩니다."

  "횡보 박스":
    description: "뚜렷한 추세 없이 일정한 상하단 가격대 내에서 등락을 반복하는 구간입니다."
    rsi_comment:
      oversold: "횡보장에서는 RSI의 신뢰도가 가장 높습니다. 박스권 하단 지지선(과매도) 터치로 기술적 반등이 예상됩니다."
      overbought: "횡보장에서는 RSI의 신뢰도가 가장 높습니다. 박스권 상단 저항선(과매수) 도달로 조정이 예상됩니다."
      neutral: "횡보장에서는 RSI의 신뢰도가 가장 높습니다. 박스권 중간에서 뚜렷한 방향성을 탐색 중입니다."
    macd_comment: "뚜렷한 추세가 부재한 박스권이므로 MACD 크로스 신호의 신뢰도는 다소 떨어집니다."

  "강세 추세":
    description: "이동평균선 정배열과 함께 매수세가 지속적으로 유입되는 우상향 국면입니다."
    rsi_comment:
      overbought: "강세장에서는 지표가 쉽게 과열권에 진입합니다. 강한 매수세로 단기 과열(70 이상) 상태이나 추세는 굳건합니다."
      pullback: "강세장에서는 지표가 쉽게 과열권에 진입합니다. 상승 추세 중 발생한 건전한 눌림목(조정) 타점입니다."
      neutral: "강세장에서는 지표가 쉽게 과열권에 진입합니다. 안정적인 상승 탄력을 유지하고 있습니다."
    macd_comment: "상승 모멘텀이 강하게 유지되며 이평선 정배열 확장을 지지하고 있습니다."
    integrated_analysis: "• 매수세가 시장을 주도하는 강세장입니다. 추세 이탈 전까지 보유가 유리합니다."

  "상승 조정":
    description: "중장기 상승 추세 베이스 내에서 단기 매물 소화 및 숨고르기가 진행되는 구간입니다."
    rsi_comment: "상승 추세 속에서 조정을 받으며 지표가 식어가고 있습니다. 40~50 부근에서 지지받는지 확인이 필요합니다."
    macd_comment: "단기적으로 데드크로스가 발생하거나 모멘텀이 둔화되었으나, 장기 상승 추세 베이스는 훼손되지 않았습니다."
    integrated_analysis: "• 상승 흐름 속 건전한 단기 조정(매물 소화)이 진행 중입니다."

  "약세 추세":
    description: "이동평균선 역배열과 함께 매도 압력이 지배적인 하락 국면입니다."
    rsi_comment:
      rebound: "약세장에서는 지표가 지속적으로 침체권에 머눕니다. 일시적인 기술적 반등 구간으로 매도를 고려할 시점입니다."
      oversold: "약세장에서는 지표가 지속적으로 침체권에 머눕니다. 극단적 과매도 상태이나, 지속적인 하락 압력을 받고 있으므로 섣부른 진입은 피해야 합니다."
      neutral: "약세장에서는 지표가 지속적으로 침체권에 머눕니다. 지속적인 하락 압력을 받고 있습니다."
    macd_comment: "하락 모멘텀이 강하며, 추세 반전을 암시하는 뚜렷한 신호가 아직 없습니다."
    integrated_analysis: "• 하락 압력이 지배적이므로 철저한 현금 비중 관리와 보수적 접근이 필수입니다."

  "변동성 폭발":
    description: "평균을 크게 상회하는 거래량과 함께 급격한 방향성 분출이 일어나는 국면입니다."
    rsi_comment: "변동성 폭발로 인해 투심이 한쪽으로 극단적으로 쏠리는 오버슈팅 및 투매 국면입니다."
    macd_comment: "단기 모멘텀이 평소의 범위를 벗어나 급격하게 방향성을 분출하고 있습니다."

  "데이터 수집/안정화 중":
    description: "신규 상장 등으로 데이터가 충분히 누적되지 않아 추세를 분석 중인 단계입니다."
    rsi_comment: "데이터 축적 중으로 지표 신뢰도를 검증 중입니다."
    macd_comment: "추세 형성 초기 단계입니다."

# 2. 다중 시간대(MTF) 주봉 추세 결합 템플릿
mtf_narratives:
  bullish_trends:
    bull: "• **장기 흐름:** 주봉(장기) 상승세가 굳건하여 일봉(단기) 수준에서도 강한 지지력을 보입니다."
    bear: "• **장기 흐름:** 단기는 긍정적이나 주봉(장기)은 하락 추세이므로 눈높이를 낮춰 대응하십시오."
  bear_trends:
    bull: "• **장기 흐름:** 단기는 부진하나 주봉(장기) 추세는 견고하여 중장기 관점에선 기회일 수 있습니다."
    bear: "• **장기 흐름:** 단기와 장기 모두 완전한 하락 추세(역배열)입니다. 보수적으로 접근하십시오."
  range_trends:
    bull: "• **장기 흐름:** 주봉(장기) 추세 상승 속 잠시 에너지를 비축하는 단기 횡보 국면입니다."
    bear: "• **장기 흐름:** 주봉(장기) 하락세 속에서 단기적으로 지지선을 형성하며 방어 중인 모습입니다."
  default: "• **장기 흐름:** 장기 흐름에 동조화되어 에너지가 응축/분출되는 변곡점 구간입니다."

# 3. 함정(Trap) 패턴 감지 텍스트
traps:
  bull_trap: "🚨 **[가짜 상승(Bull Trap) 주의]** 저항을 돌파했으나 거래량이 부진하거나 윗꼬리가 깁니다. 섣부른 추격 매수를 자제하십시오.\n\n"
  bear_trap: "🚨 **[가짜 하락(Bear Trap) 주의]** 지지를 이탈했으나 하락 물량 방어 흔적(아랫꼬리)이 보입니다. 일시적 충격일 수 있습니다.\n\n"

